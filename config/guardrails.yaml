# Guardrail configuration (spec 08). Deterministic checks run before any LLM-based check.
version: 1

pii_patterns:                     # masked in prompts as [AADHAAR], [PAN], ...; never logged raw
  AADHAAR: '\b[2-9]\d{3}[\s-]?\d{4}[\s-]?\d{4}\b'
  PAN: '\b[A-Z]{5}\d{4}[A-Z]\b'
  PHONE_IN: '(?:\+91[\s-]?)?\b[6-9]\d{9}\b'
  EMAIL: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
  CARD: '\b(?:\d[ -]?){13,16}\b'
  IFSC: '\b[A-Z]{4}0[A-Z0-9]{6}\b'

injection_markers:                # case-insensitive substrings; a hit routes to the LLM classifier for confirmation
  - ignore previous instructions
  - ignore all instructions
  - disregard the above
  - system prompt
  - you are now
  - developer mode
  - reveal your instructions
  - act as an admin
  - as a supervisor, show
  - print the hidden

scope:
  allowed: [insurance policies, policy coverage, claims, claim documents, hospitals and network, customer interactions, portfolio analytics]
  out_of_scope_examples: [medical diagnosis or treatment advice, legal advice, investment advice, general chit-chat beyond greetings, coding help]
  out_of_scope_keywords:          # case-insensitive substrings refused before any LLM call; keep them narrow
    - medical advice
    - legal advice
    - investment advice
    - which medicine
    - what dosage
    - should i take
    - write code
    - python script
    - stock tips

no_guarantee:
  patterns:                       # output check; any hit triggers rewrite, then re-check
    - 'will (definitely |certainly )?be (approved|paid|settled)'
    - '\bguarantee(d|s)?\b'
    - '\b(definitely|certainly|surely) (covered|approved|payable)\b'
    - '\b100% (covered|approved)\b'
    - '\bassure you\b'
  mandated_wording: "Final decision depends on complete claim assessment."   # policy wordings §15
  stream_holdback_chars: 64       # streamed drafts lag this far behind so a promise is never half-sent; ≥ longest pattern match

citation_format: '[{product} §{section_no} {section_name}]'      # e.g. [Health Secure Plus §5 Maternity]
sql_citation_format: '[{table}:{key}]'                          # e.g. [claims:CLM300210]

refusals:
  ACCESS_DENIED: "I can only share details of policies and claims linked to your own account."
  OUT_OF_SCOPE: "I can help with policies, claims, claim documents and network hospitals. That request is outside what I can help with here."
  INJECTION: "I can't follow that instruction. Ask me about a policy, a claim or a hospital and I'll help."
  GUARANTEE_REQUEST: "I can't promise an outcome. Final decision depends on complete claim assessment, but I can show you what the claim still needs."
  NOT_FOUND: "I couldn't find {entity} in our records. Please check the ID."
  LOW_CONFIDENCE: "The policy documents don't address this directly. The closest clause is shown below; a specialist can confirm."
