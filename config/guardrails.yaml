# Guardrail configuration (spec 08). Deterministic checks run before any LLM-based check.
version: 1

pii_patterns:                     # masked in prompts as [AADHAAR], [PAN], ...; never logged raw
  AADHAAR: '\b[2-9]\d{3}[\s-]?\d{4}[\s-]?\d{4}\b'
  PAN: '\b[A-Z]{5}\d{4}[A-Z]\b'
  PHONE_IN: '(?:\+91[\s-]?)?\b[6-9]\d{9}\b'
  EMAIL: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
  CARD: '\b(?:\d[ -]?){13,16}\b'
  IFSC: '\b[A-Z]{4}0[A-Z0-9]{6}\b'

injection_markers:                # case-insensitive substrings; a hit routes to the LLM classifier for confirmation
  - ignore previous instructions
  - ignore all instructions
  - disregard the above
  - system prompt
  - you are now
  - developer mode
  - reveal your instructions
  - act as an admin
  - as a supervisor, show
  - print the hidden

scope:
  allowed: [insurance policies, policy coverage, claims, claim documents, hospitals and network, customer interactions, portfolio analytics]
  out_of_scope_examples: [medical diagnosis or treatment advice, legal advice, investment advice, general chit-chat beyond greetings, coding help]
  out_of_scope_keywords:          # case-insensitive substrings refused before any LLM call; keep them narrow
    - medical advice
    - legal advice
    - investment advice
    - which medicine
    - what dosage
    - should i take
    - write code
    - python script
    - stock tips

no_guarantee:
  patterns:                       # output check; any hit triggers rewrite, then re-check
    - 'will (definitely |certainly )?be (approved|paid|settled)'
    - '\bguarantee(d|s)?\b'
    - '\b(definitely|certainly|surely) (covered|approved|payable)\b'
    - '\b100% (covered|approved)\b'
    - '\bassure you\b'
  mandated_wording: "Final decision depends on complete claim assessment."   # policy wordings §15
  stream_holdback_chars: 64       # streamed drafts lag this far behind so a promise is never half-sent; ≥ longest pattern match

guarantee_request:                # input check; a hit is answered from the wording, never refused (spec 08 input rule 4)
  patterns:                       # case-insensitive regexes over the masked user message
    - '\bguarantee(d|s)?\b'
    - '\bpromise\b'
    - '\bassure (me|us)\b'
    - '\b(definitely|certainly|surely|for sure) (be |get )?(approved|paid|settled|covered|accepted)\b'
    - '\b(will|would) (it|this|my claim|the claim) (definitely|certainly|surely) '
    - '\b100% (sure|certain|approved|covered)\b'
  pinned_sections: [14, 15]       # common sections fetched by chunk id on a guarantee turn (§14 Disclaimer, §15 FAQ)
  cite_section: 15                # the lead cites the §15 chunk carrying no_guarantee.mandated_wording

hidden_field_terms:               # V6: customer-persona answers may not mention these (case-insensitive regexes).
  # Narrow on purpose: the wordings say "escalated for manual review" (§13) and "High-risk adventure activities".
  - 'fraud[\s_-]*(risk[\s_-]*)?score'
  - '\bfraud[\s_-]*risk\b'
  - 'manual[\s_-]*review[\s_-]*flag'
  - '\bflagged for manual review\b'
  - 'risk[\s_-]*segment'
  - '\b(low|medium|high)[\s-]risk (customer|segment|category|profile|tier|band)\b'
  - '\byou are (a |an )?(low|medium|high)[\s-]risk\b'
  - '\brisk (category|profile|tier|rating|level|band)\b'

conflict_rendering:               # spec 08 Conflict rendering; deterministic completion when the draft omits it
  precedence_sentence: "Your policy schedule governs this policy's numbers; the product wording describes the general terms."
  concepts:                       # sum_insured and co_pay deferred (3-day scope)
    waiting_period:
      name: Waiting period
      schedule_field: waiting_period_days     # PolicyView / ClaimView
      coverage_attribute: waiting_period      # knowledge.coverage.get_coverage
      coverage_field: waiting_days
      unit: days

v7:                              # spec 08 V7 groundedness
  verbatim_min_words: 4           # a claim this long whose normalised text is verbatim in the evidence is supported without a judge call

currency:                         # spec 08 currency check: every amount is in rupees (₹, Indian grouping); a hit fails and retries
  forbidden_patterns:             # case-insensitive regexes over the answer with citation labels removed
    - '(?<!\w)(?:US)?\$\s?\d[\d,]*(?:\.\d+)?'
    - '\d[\d,.]*\s?\$'
    - '\b(?:USD|EUR|GBP|AUD|CAD|SGD|AED)\b'
    - '[€£¥]\s?(?:\d[\d,]*(?:\.\d+)?)?'
    - '\b(?:dollars?|euros?|pounds? sterling)\b'
    - '\b(?:Rs\.?|INR)\s?\d[\d,]*(?:\.\d+)?'
  feedback: "Write every amount in rupees with the ₹ sign and Indian digit grouping (for example ₹56,714), copied from the evidence; never $, Rs, INR or another currency."

citation_format: '[{product} §{section_no} {section_name}]'      # e.g. [Health Secure Plus §5 Maternity]
faq_citation_format: '[{product} §{section_no} {section_name} Q{q}]'  # one §15 FAQ pair, e.g. [All products §15 Training FAQ Q2]
sql_citation_format: '[{table}:{key}]'                          # e.g. [claims:CLM300210]

refusals:
  ACCESS_DENIED: "I can only share details of policies and claims linked to your own account."
  OUT_OF_SCOPE: "I can help with policies, claims, claim documents and network hospitals. That request is outside what I can help with here."
  INJECTION: "I can't follow that instruction. Ask me about a policy, a claim or a hospital and I'll help."
  GUARANTEE_REQUEST: "I can't promise an outcome. Final decision depends on complete claim assessment, but I can show you what the claim still needs."
  NOT_FOUND: "I couldn't find {entity} in our records. Please check the ID."
  LOW_CONFIDENCE: "The policy documents don't address this directly. The closest clause is shown below; a specialist can confirm."
