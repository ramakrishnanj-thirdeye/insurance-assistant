# Persona-based access (spec 08). Enforced in tool code and the SQL validator, never by prompt.
version: 1
personas:
  customer:
    label_plural: customers          # tool-denial text (refusals.TOOL_DENIED)
    description: Self-service policyholder; principal_id = customer_id
    row_scope: own_customer        # every query is constrained to rows owned by principal_id
    ownership_paths:               # how ownership is checked; interactions are reached ONLY via their claim
      policies: policies.customer_id = :principal_id
      claims: claims.customer_id = :principal_id
      claim_documents: claim_id IN (SELECT claim_id FROM silver.claims WHERE customer_id = :principal_id)
      customer_interactions: claim_id IN (SELECT claim_id FROM silver.claims WHERE customer_id = :principal_id)
    hidden_columns: [fraud_risk_score, manual_review_flag, risk_segment, customer_name]   # names only for agent and supervisor (spec 05)
    tools: [get_claim, get_claim_documents, get_policy, get_customer_summary, check_hospital, get_claim_interactions, search_policy, get_coverage, analyze_claim]
    analytics_hidden_tables: [rule_results]   # never reached: customers have no run_analytics
    analyze_claim_view: customer   # rule names and next steps only; no escalation internals
    can_resume_review: false
    can_read_eval_reports: false   # GET /eval/reports* (spec 09)
  claims_agent:
    label_plural: claims agents          # tool-denial text (refusals.TOOL_DENIED)
    description: Operations user handling individual claims
    row_scope: all
    hidden_columns: []
    mask_columns_in_analytics: [customer_name]
    analytics_hidden_tables: [rule_results]   # rule outcomes are supervisor analytics, like portfolio_audit
    tools: [get_claim, get_claim_documents, get_policy, get_customer_summary, check_hospital, get_claim_interactions, search_policy, get_coverage, analyze_claim, run_analytics]
    analyze_claim_view: full
    can_resume_review: true
    can_read_eval_reports: true
  supervisor:
    label_plural: supervisors          # tool-denial text (refusals.TOOL_DENIED)
    description: Claims supervisor and analyst; sees audit and analytics
    row_scope: all
    hidden_columns: []
    mask_columns_in_analytics: []
    tools: [get_claim, get_claim_documents, get_policy, get_customer_summary, check_hospital, get_claim_interactions, search_policy, get_coverage, analyze_claim, run_analytics, portfolio_audit]
    analyze_claim_view: full
    can_resume_review: true
    can_read_eval_reports: true
