# Central runtime settings. Loaded by src/insurai/settings.py (pydantic-settings).
# Any key can be overridden by an env var: INSURAI__<SECTION>__<KEY>, e.g. INSURAI__LLM__PROFILE=local
project: insurance-assistant

# Fixed "today" for every derived field, rule and eval. Latest claim_date in the dataset.
as_of_date: 2026-10-01

paths:
  raw_dir: data/raw
  policy_docs_dir: data/raw/policy_documents
  warehouse: data/warehouse.duckdb
  qdrant_path: data/qdrant              # Qdrant embedded (local) mode
  models_dir: data/models               # fastembed model cache; filled by `make index`
  checkpoints: data/checkpoints.sqlite  # LangGraph SqliteSaver
  dq_report: data/data_quality_report.json
  eval_reports: eval/reports

llm:
  profile: api-lite                     # local | api-lite | api-quality
  profiles:
    local:                              # num_ctx: Ollama truncates silently past it; reasoning off = no Qwen3 thinking;
                                        # seed: reproducible eval runs
      generator: {provider: ollama, model: "qwen3:8b", temperature: 0, num_ctx: 8192, reasoning: false, request_timeout_s: 180, seed: 42}
      small:     {provider: ollama, model: "qwen3:8b", temperature: 0, num_ctx: 8192, reasoning: false, request_timeout_s: 180, seed: 42}
      judge:     {provider: ollama, model: "llama3.1:8b", temperature: 0, num_ctx: 8192, request_timeout_s: 180, seed: 42}  # another model family (ADR-006); no thinking switch
      # sql: optional, text-to-SQL only; unset = the generator. qwen2.5-coder:7b tied qwen3:8b (0.80) but adds a model swap per turn (ADR-006 2026-10-08)
      # sql:     {provider: ollama, model: "qwen2.5-coder:7b", temperature: 0, num_ctx: 8192, request_timeout_s: 180, seed: 42}
    api-lite:
      generator: {provider: anthropic, model: claude-haiku-4-5-20251001, temperature: 0}
      small:     {provider: anthropic, model: claude-haiku-4-5-20251001, temperature: 0}
      judge:     {provider: anthropic, model: claude-sonnet-5-5, temperature: 0}
    api-quality:
      generator: {provider: anthropic, model: claude-sonnet-5-5, temperature: 0}
      small:     {provider: anthropic, model: claude-haiku-4-5-20251001, temperature: 0}
      judge:     {provider: anthropic, model: claude-opus-5-5, temperature: 0}
  max_output_tokens: 1200
  request_timeout_s: 60

retrieval:
  dense_model: BAAI/bge-small-en-v1.5     # fastembed TextEmbedding, 384-d
  sparse_model: Qdrant/bm25               # fastembed SparseTextEmbedding
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2  # fastembed TextCrossEncoder; beat bge-reranker-base on p95 (ADR-002)
  onnx_threads: 8                         # per model; null = onnxruntime default (all cores), which makes the
                                          # three sessions contend and was ~10x slower in the M2 spike
  collection_policies: policy_chunks
  collection_sql_examples: sql_examples
  prefetch_k: 20
  final_k: 5
  rerank_threshold: -4.66                 # M2 sweep (max F1): probes <= -9.9, answerable >= 0.59; null = gate off
  section_boost: 0.1                      # added to rerank score when a chunk's section matches a hint
  neighbour_sections: {5: [4], 4: [5]}    # pull §4 with §5 and vice versa (waiting periods + maternity)

thresholds:
  fraud_review_score: 0.5                 # ~1% of claims; the score carries no signal in this data
  high_value_inr: 236053                  # p95 of claim_amount; recomputed and logged by `make data`

sql:
  row_limit: 200
  timeout_s: 10
  repair_attempts: 1
  # Functions generated SQL may never call (spec 02 validator). fnmatch patterns, lower case. File and network
  # readers, session variables and settings, catalog introspection and arbitrary query execution.
  forbidden_functions: [read_*, "*_scan", glob, sniff_csv, parquet_*, getvariable, current_setting, query, query_table,
                        duckdb_*, pragma_*, "*_metadata", load_extension, install_extension, httpfs_*, sql_auto_complete]

agent:
  verifier_retries: 1
  max_parallel_workers: 4
  tool_transport: inprocess      # inprocess | mcp (langchain-mcp-adapters to `make mcp`; spec 05; mcp deferred)
  history_turns: 6               # last N user+assistant turns sent to planner and synthesizer (spec 06)
  turn_timeout_s: 300            # a thread `running` longer than this is stale; a new request takes it over (spec 09)
  heartbeat_s: 2.0               # while a node runs longer than this, SSE `heartbeat` every heartbeat_s (spec 09)
  dossier_polish_customer_message: true  # small-model polish of the dossier's customer message (spec 07); false = template only
  common_probe_top_k: 3          # routing rule 2: a confident common (ALL) chunk in the probe's top k answers from the common sections (spec 06)

api:
  host: 127.0.0.1
  port: 8000
  cors_origins: ["http://localhost:8501", "http://127.0.0.1:8501"]   # Streamlit (make ui)

ui:                              # Streamlit (spec 10); talks only to the API, never to DuckDB
  api_url: http://127.0.0.1:8000
  # Customer principal picker. CUST139920 owns CLM300210 (Approved; the run-of-show claim). The other nine are
  # the lowest customer IDs with an open claim, three per open status (picked once from silver.claims, 2026-10-06).
  sample_customers:
    - {customer_id: CUST139920, hint: "CLM300210 · Approved"}
    - {customer_id: CUST100000, hint: "CLM327142 · Under Review"}
    - {customer_id: CUST100002, hint: "CLM396464 · Under Review"}
    - {customer_id: CUST100006, hint: "CLM317691 · Under Review"}
    - {customer_id: CUST100010, hint: "CLM380932 · Submitted"}
    - {customer_id: CUST100025, hint: "CLM360450 · Submitted"}
    - {customer_id: CUST100035, hint: "CLM328671 · Submitted"}
    - {customer_id: CUST100003, hint: "CLM343257 · Pending Documents"}
    - {customer_id: CUST100009, hint: "CLM371810 · Pending Documents"}
    - {customer_id: CUST100011, hint: "CLM353139 · Pending Documents"}

mcp:
  http_host: 127.0.0.1
  http_port: 8765

tracing:
  phoenix_enabled: true
  phoenix_project: insurance-assistant

eval:
  # Gate targets (spec 11): a number is a minimum, {max: x} a maximum. With eval/reports/baseline.json the
  # gate also fails on a regression from the baseline (insurai.eval.baseline).
  targets:
    sql_facts.accuracy: 1.0
    policy_clauses.recall_at_5: 0.95
    routing.intent_accuracy: 0.95
    routing.entity_exact: 0.98
    claim_analysis.rule_status_exact: 1.0
    claim_analysis.blocker_mention: 1.0
    claim_analysis.review_interrupt: 1.0
    claim_analysis.invented_findings_free: 1.0     # share of narratives with zero invented findings (judge); target invented_findings = 0
    analytics.exec_accuracy: 0.90                  # spec 02 AC-02-07
    analytics.unsafe_blocked: 1.0                  # eval/probes/unsafe_sql.yaml rejected with the expected reason
    claim_analysis.orphan_numbers: {max: 0}        # AC-08-05: narratives failing V3 (numbers not in evidence)
    claim_analysis.correctness: 0.90               # judge score >= 4 (judge_correctness.md)
    claim_analysis.faithfulness: 0.95              # V7: share of atomic claims supported
    policy_clauses_e2e.correctness: 0.90
    policy_clauses_e2e.faithfulness: 0.95
    policy_clauses_e2e.citation_accuracy: 0.95
    comparisons.correctness: 0.90
    comparisons.faithfulness: 0.95
    adversarial.refusal_correct: 1.0               # access, injection, unknown-ID, out-of-scope items
    adversarial.guarantee_handled: 1.0             # answered with the §15 citation, never refused
    adversarial.handled: 0.95                      # AC-08-02 overall
    suite.false_refusal: {max: 0.05}               # non-adversarial items refused
  # Judge-based metrics are advisory, not gated, while the judge is uncalibrated (judge agreement below 80%
  # or not yet scored, eval/calibration.py): the gate skips them and the report lists them as advisory.
  advisory_when_uncalibrated: [correctness, faithfulness]

guardrails:                      # spec 08
  # V7 groundedness judge in the request path, per llm profile. Off for local: the judge is another model
  # (llama3.1:8b) and Ollama would swap models on every answer; V7 then runs in the eval only and the trace says so.
  v7_live: {local: false, api-lite: true, api-quality: true}

logging:
  level: INFO                             # stdlib level for the `insurai` logger (insurai.observability)
