# Deterministic query expansion and entity resolution (spec 04 stage 1, spec 06 resolve_context).
version: 1

# Product gazetteer: canonical name -> aliases (matched case-insensitively, then rapidfuzz >= 90).
products:
  Health Secure Plus:          [HSP, health secure, secure plus]
  Family Care Gold:            [FCG, family care, family gold]
  Critical Care Elite:         [CCE, critical care, critical illness plan]
  Maternity Protect:           [maternity plan, maternity protect]
  Senior Health Shield:        [senior shield, senior plan, senior citizen plan]
  Car Shield Plus:             [car shield, car policy]
  Motor Protect Comprehensive: [motor protect, comprehensive motor, MPC]
  Two Wheeler Secure:          [two wheeler, bike policy, scooter policy]
  Global Travel Secure:        [global travel, international travel]
  Student Travel Protect:      [student travel, study abroad]

# Fast path (spec 06 routing rule 1): one claim ID, a status keyword, few words, no other intent keyword.
fast_path:
  max_words: 12
  status_keywords: [status, state, where is, update]
  other_intent_keywords: [document, missing, pending, interaction, called, contact, analy, why, reject, covered,
                          cover, waiting, hospital, network, policy, customer, compare, approved amount, how much,
                          guarantee, and]

# Greeting fast path (spec 06 routing rule 1b, AC-06-27): a short message made only of these words, with at least
# one opener, is answered from the greeting template with no planner call. Any other word sends it to the planner.
greeting:
  max_words: 6
  openers: [hi, hello, hey, namaste, thanks, thank, thx, cheers, bye, goodbye, morning, afternoon, evening]
  fillers: [you, good, ok, okay, great, so, much, very, a, lot, that, helps, there, team, all]

# Intent pruning and promotion (spec 06 routing rules 9 and 10), applied by finalize_plan after the planner.
# Each list is built from the intent's definition in config/prompts/planner.md (`words`), never from eval
# questions, plus the config lists named in `from`, plus every glossary synonym group that shares a term with
# the result. Matching is case-insensitive, whole word or phrase with an optional plural s; a trailing * makes
# an entry a prefix (contact* matches contacted). Intents not listed here (policy_question, coverage_compare,
# analytics, customer_summary, greeting, out_of_scope) are never pruned.
# `from` sources: fast_path_status_keywords (above), dossier_status_words and dossier_assess_keywords
# (config/rules.yaml dossier), document_types (config/required_documents.yaml), promote_to_analysis (below).
# Coverage words ("is it covered") stay with policy_question: a stray claim_analysis next to a policy question
# is pruned unless the message asks for an analysis.
routing:
  intent_triggers:
    claim_status:
      words: [status, decision, current]
      from: [fast_path_status_keywords, dossier_status_words]
    claim_documents:
      words: [document, checklist, missing, pending, rejected, verified]
      from: [document_types]
    claim_interactions:
      words: [interaction, contact*, channel, sentiment, escalat*]
    claim_analysis:
      words: [analy*, summar*, assess*, explain*, why]
      from: [dossier_assess_keywords, promote_to_analysis]
    hospital_check:
      words: [hospital, network, network hospital]
    policy_details:
      words: [policy, schedule, status, effective, sum insured, waiting period, co-pay, deductible, date]
  # A claim_status intent in a message with one of these words becomes claim_analysis in explain mode.
  promote_to_analysis: [summary, overview, summarise, summarize, why]
  # A claim intent with no claim ID, no active claim and none of these references in the message is a question
  # about the wording (rule 2), not a request to pick a claim. Case-insensitive regular expressions.
  claim_reference_patterns:
    - '\b(my|this|that|the|our|his|her|their|same) claims?\b(?!\s+(process|procedure))'
    - '\bclaim\s+(id|number|no\.?|ref(erence)?)\b'

# Follow-up phrases that resolve to active_entities (spec 06 routing rule 3).
follow_up_phrases: [it, its, this claim, that claim, the claim, this policy, that policy, the policy, my claim, my policy, same claim]  # whole words, case-insensitive

